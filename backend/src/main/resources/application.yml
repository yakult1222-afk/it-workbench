server:
  port: 8080

spring:
  datasource:
    # 通过环境变量覆盖：MYSQL_HOST / MYSQL_PORT / MYSQL_DB / MYSQL_USER / MYSQL_PASSWORD
    url: jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DB:it_workbench}?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&useSSL=false
    username: ${MYSQL_USER:root}
    password: ${MYSQL_PASSWORD:root123456}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2

mybatis-plus:
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl
  global-config:
    banner: false

# 日报总结 AI 配置（OpenAI 兼容协议：DeepSeek / GLM / 通义 / OpenAI / Ollama 均可）
workbench:
  ai:
    base-url: ${AI_BASE_URL:https://api.deepseek.com/v1}
    api-key: ${AI_API_KEY:}      # 留空 = 不调 AI，日报走模板汇总
    model: ${AI_MODEL:deepseek-chat}
    timeout-ms: 30000

logging:
  level:
    com.qinghuan.workbench: info
